<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Catcher</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        background: #05070d;
        color: #ecf1ff;
        font-family: Arial, Helvetica, sans-serif;
      }

      canvas {
        display: block;
      }

      .top-nav {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      .top-nav a {
        color: #ecf1ff;
        text-decoration: none;
        font-size: 14px;
        background: rgba(5, 7, 13, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 8px 12px;
        backdrop-filter: blur(10px);
      }

      .top-nav a:hover {
        border-color: rgba(125, 211, 252, 0.9);
      }
    </style>
    <script src="catcher.js" defer></script>
  </head>
  <body>
    <nav class="top-nav">
      <a href="index.html">Hand tracker</a>
    </nav>
  </body>
</html>
