<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <style>
      * {
        margin: 0px;
        padding: 0px;
      }

      body {
        overflow: hidden;
        background: #05070d;
        color: #ecf1ff;
      }

      canvas {
        z-index: 0 !important;
      }

      ul {
        position: fixed;
        top: 15px;
        left: 20px;
        list-style-type: none;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: rgba(5, 7, 13, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 16px 18px;
        backdrop-filter: blur(10px);
        line-height: 1.5;
        min-width: 280px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        z-index: 10;
      }

      button {
        appearance: none;
        border: 1px solid rgba(125, 211, 252, 0.45);
        background: rgba(13, 18, 30, 0.92);
        color: #ecf1ff;
        padding: 10px 12px;
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
        width: 100%;
        margin-bottom: 10px;
      }

      button:hover {
        border-color: rgba(125, 211, 252, 0.9);
      }

      li {
        margin: 6px 0;
      }

      .stream {
        color: #7dd3fc;
      }
    </style>
    <script src="hand.js" defer></script>
  </head>
  <body>
    <ul>
      <li><button class="cam-toggle" type="button">Cam: On</button></li>
      <li class="stream">Stream: disabled</li>
      <li class="confidence"></li>
      <li class="handed"></li>
      <li class="pointerTip"></li>
      <li class="thumbTip"></li>
      <li class="function"></li>
    </ul>
  </body>
</html>
